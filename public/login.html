<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Digitable</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color:#fffbfbb7;
      color: #374151;
      font-family: Arial, sans-serif;
    }
    .login-container {
      max-width: 800px;
      min-height: 400px;
      box-shadow: 0 10px 25px rgb(0, 0, 0);
    }
    .welcome-section img {
      width: 50px;
    }
    .icon {
      font-size: 1.5rem;
      margin-right: 0.5rem;
    }
    @media (max-width: 640px) {
      .login-container {
        max-width: 90%;
      }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="flex flex-col md:flex-row w-full max-w-4xl bg-white rounded-lg shadow-2xl overflow-hidden login-container ">
    <!-- Left Section -->
    <div class="w-full md:w-1/2 p-6 md:p-8 text-gray-800 flex flex-col justify-center items-center bg-gradient-to-br from-blue-50 to-indigo-400">
      <img src="https://dtbl.go.digitable.io/neverdone/assets/images/logo.png" alt="Digitable Logo" class="mb-4 h-14 mx-auto">
      <h2 class="text-xl md:text-2xl font-bold text-center">Welcome to Your Workspace</h2>
      <p class="mt-2 text-gray-600 text-center">Streamline your workflow with our intuitive platform</p>
      <div class="mt-5 flex justify-center space-x-10">
        <span class="icon">⚡</span>
        <span class="icon">🛡️</span>
        <span class="icon">🚀</span>
      </div>
    </div>
    
    <!-- Right Section - Updated to match left side -->
    <div class="w-full md:w-1/2 p-6 bg-white text-gray-800 flex items-center justify-center">
      <div class="w-full max-w-xs space-y-4">
        <h2 class="text-xl md:text-2xl font-bold text-center mb-6">Sign in to your account</h2>
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700">Tenant Name</label>
          <input
            type="text"
            id="username"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
            placeholder="Enter your tenant name"
            readonly
          />
        </div>
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700">Password</label>
          <input
            type="password"
            id="password"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
            placeholder="Enter your password"
          />
        </div>
        
        <!-- Show Password Checkbox -->
        <div class="flex items-center justify-center">
          <input
            type="checkbox"
            id="showPassword"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
          />
          <label for="showPassword" class="ml-2 block text-sm text-gray-700">
            Show password
          </label>
        </div>

        <button
          id="loginButton"
          class="w-full bg-blue-800 hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center justify-center transition-colors duration-200 mt-4"
        >
          Continue
        </button>
        <p id="loginError" class="text-red-500 text-sm mt-2 text-center hidden">
          Invalid tenant name or password.
        </p>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let BASE_URL;
    const today = new Date().toISOString().split("T")[0];
    const UNIVERSAL_PASSWORD = "admin@123";
    const IS_LOCAL = window.location.hostname.includes("localhost");

    $(document).ready(() => {
      const hostname = window.location.hostname;
      const tenantFromUrl = hostname.split(".")[0];
      // Load tenant from URL and make it read-only
      $("#username").val(tenantFromUrl || "").prop("readonly", true);

      // Show password functionality
      $("#showPassword").on("change", function() {
        const passwordInput = $("#password");
        if ($(this).is(":checked")) {
          passwordInput.attr("type", "text");
        } else {
          passwordInput.attr("type", "password");
        }
      });

      $("#loginButton").on("click", () => {
        const tenant = $("#username").val().trim();
        const password = $("#password").val();
        if (tenant && password) {
          if (login(tenant, password)) {
            window.location.href = "index.html";
          } else {
            $("#loginError").removeClass("hidden");
          }
        } else {
          $("#loginError").removeClass("hidden");
        }
      });

      function login(inputTenant, password) {
        const hostname = window.location.hostname;
        const tenantFromUrl = hostname.split(".")[0];
        console.log(
          "Login - Hostname:",
          hostname,
          "Tenant from URL:",
          tenantFromUrl,
          "Input Tenant:",
          inputTenant
        );
        if (
          tenantFromUrl !== "localhost" &&
          tenantFromUrl !== "go" &&
          inputTenant !== tenantFromUrl
        ) {
          console.log("Tenant mismatch");
          return false;
        }
        if (password === UNIVERSAL_PASSWORD && inputTenant.trim() !== "") {
          localStorage.setItem("isAuthenticated", "true");
          localStorage.setItem("tenant", inputTenant);
          BASE_URL = IS_LOCAL
            ? `http://${inputTenant}.localhost:3008/api`
            : `https://${inputTenant}.go.digitable.io:3008/api`;
          console.log("Login successful, BASE_URL:", BASE_URL);
          return true;
        }
        console.log("Login failed: Invalid password or tenant");
        return false;
      }
    });
  </script>
</body>
</html>
